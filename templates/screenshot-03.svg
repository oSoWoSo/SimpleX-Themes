<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <!-- Background -->
  <rect id="bg" width="400" height="800" fill="#0f1423"/>

  <!-- Header -->
  <g id="header">
    <rect x="0" y="0" width="400" height="60" fill="#0f1423"/>
    <rect id="avatar" x="15" y="15" width="30" height="30" rx="6" fill="#1e3a5f"/>
    <text id="title" x="200" y="35" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">Chats</text>
    <circle cx="370" cy="30" r="8" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <text x="370" y="34" fill="#3b82f6" font-size="10" text-anchor="middle">X</text>
  </g>

  <!-- Search bar -->
  <g id="search">
    <rect x="15" y="65" width="370" height="35" rx="8" fill="#1f2937"/>
    <circle cx="35" cy="82" r="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="41" y1="88" x2="46" y2="93" stroke="#6b7280" stroke-width="1.5"/>
    <text x="55" y="87" fill="#6b7280" font-size="14">Search</text>
    <rect x="350" y="72" width="25" height="20" rx="4" fill="#67e8f9"/>
    <line x1="358" y1="78" x2="367" y2="78" stroke="#0f1423" stroke-width="1.5"/>
    <line x1="358" y1="82" x2="367" y2="82" stroke="#0f1423" stroke-width="1.5"/>
    <line x1="358" y1="86" x2="367" y2="86" stroke="#0f1423" stroke-width="1.5"/>
  </g>

  <!-- Chat list items -->
  <g id="chat-list">
    <!-- Item 1 -->
    <g transform="translate(0,110)">
      <rect x="15" y="5" width="40" height="40" rx="6" fill="#1e3a5f"/>
      <text x="65" y="20" fill="#ffffff" font-size="14" font-weight="bold">SimpleX Themes</text>
      <text x="65" y="38" fill="#9ca3af" font-size="12">If you...</text>
      <text x="370" y="20" fill="#6b7280" font-size="11" text-anchor="end">8/27</text>
      <polygon points="355,30 360,25 365,30 360,35" fill="#6b7280"/>
    </g>
    <line x1="15" y1="160" x2="385" y2="160" stroke="#1f2937" stroke-width="0.5"/>

    <!-- Item 2 -->
    <g transform="translate(0,165)">
      <rect x="15" y="5" width="40" height="40" rx="6" fill="#ffffff"/>
      <text x="65" y="20" fill="#ffffff" font-size="14" font-weight="bold">Gas Lighter</text>
      <text x="65" y="38" fill="#9ca3af" font-size="12">I just uploaded...</text>
      <text x="370" y="20" fill="#6b7280" font-size="11" text-anchor="end">8/27</text>
      <polygon points="355,30 360,25 365,30 360,35" fill="#6b7280"/>
    </g>
    <line x1="15" y1="210" x2="385" y2="210" stroke="#1f2937" stroke-width="0.5"/>

    <!-- Item 3 -->
    <g transform="translate(0,215)">
      <rect x="15" y="5" width="40" height="40" rx="6" fill="#000000"/>
      <text x="25" y="30" fill="#10b981" font-size="12" font-weight="bold">PSA</text>
      <text x="65" y="20" fill="#ffffff" font-size="14" font-weight="bold">PSA-2...</text>
      <text x="65" y="38" fill="#9ca3af" font-size="12">connected</text>
      <text x="370" y="20" fill="#6b7280" font-size="11" text-anchor="end">8/27</text>
      <path d="M355,28 L365,28 M360,28 L360,38" stroke="#6b7280" stroke-width="1.5" fill="none"/>
    </g>
    <line x1="15" y1="260" x2="385" y2="260" stroke="#1f2937" stroke-width="0.5"/>

    <!-- Item 4: Private notes -->
    <g transform="translate(0,265)">
      <circle cx="35" cy="25" r="20" fill="#1f2937"/>
      <text x="35" y="30" fill="#6b7280" font-size="16" text-anchor="middle">📁</text>
      <text x="65" y="20" fill="#ffffff" font-size="14" font-weight="bold">Private notes</text>
      <text x="370" y="20" fill="#6b7280" font-size="11" text-anchor="end">8/07</text>
    </g>
  </g>

  <!-- FAB -->
  <circle cx="360" cy="750" r="25" fill="#67e8f9"/>
  <path d="M350,750 L370,750 M360,740 L360,760" stroke="#0f1423" stroke-width="3"/>
</svg>